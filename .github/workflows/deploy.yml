name: Deploy Landing to AWS (S3 + CloudFront)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required GitHub Secrets:
# - AWS_ACCESS_KEY_ID
# - AWS_SECRET_ACCESS_KEY

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: twolaps-landing-production
  CLOUDFRONT_DISTRIBUTION_ID: E2VOWACTZH0JCW

jobs:
  deploy:
    name: Build & Deploy Landing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          pnpm build

          if [[ ! -d "dist" ]]; then
            echo "Build failed: 'dist' directory not found"
            exit 1
          fi
          if [[ ! -f "dist/index.html" ]]; then
            echo "Build failed: 'dist/index.html' not found"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3 with smart caching
        run: |
          # 1. index.html — no-cache (siempre revalidar para no servir HTML viejo que referencia assets borrados)
          aws s3 cp dist/index.html s3://${S3_BUCKET}/index.html \
            --cache-control "public, max-age=0, must-revalidate"

          # 2. Resto de ficheros (excepto assets/ e index.html) — cache corto
          aws s3 sync dist/ s3://${S3_BUCKET}/ \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude "assets/*" \
            --exclude "index.html"

          # 3. assets/* con hash — cache inmutable de 1 año
          if [[ -d "dist/assets" ]]; then
            aws s3 sync dist/assets/ s3://${S3_BUCKET}/assets/ \
              --delete \
              --cache-control "public, max-age=31536000, immutable"
          fi

          # Verificar
          aws s3 ls s3://${S3_BUCKET}/index.html > /dev/null || { echo "index.html missing"; exit 1; }
          aws s3 ls s3://${S3_BUCKET}/assets/ --recursive | grep -q "\.js" || { echo "No JS assets"; exit 1; }

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Created invalidation: ${INVALIDATION_ID}"
          echo "Distribution URL: https://d3q6ujo95dbqk2.cloudfront.net"
